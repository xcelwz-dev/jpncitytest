<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Japan Prefectures: Masterpiece</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="data.js"></script>
    
    <style>
        /* ================= ธีมสว่าง / มืด ================= */
        :root {
            --bg-page: #f5f7fa;
            --bg-card: #ffffff;
            --text-main: #2d3436;
            --text-muted: #8395a7;
            --border: #e8ecf1;
            --primary: #54a0ff;
            --success: #1dd1a1;
            --danger: #ff6b6b;
            --shadow: 0 12px 40px -12px rgba(0,0,0,0.08);
            --radius: 24px;
        }

        [data-theme="dark"] {
            --bg-page: #151618;
            --bg-card: #222428;
            --text-main: #f5f6fa;
            --text-muted: #8395a7;
            --border: #2d3238;
            --primary: #48dbfb;
            --shadow: 0 12px 40px -12px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { font-family: 'Kanit', sans-serif; background: var(--bg-page); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; overflow-x: hidden; }
        .jp-text { font-family: 'Noto Sans JP', sans-serif; }

        .container { width: 100%; max-width: 900px; background: var(--bg-card); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); position: relative; }

        .header-box { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0 0 5px 0; font-weight: 600; font-size: 28px; }
        
        .theme-btn { position: absolute; top: 30px; right: 30px; background: var(--bg-page); border: none; font-size: 20px; cursor: pointer; color: var(--text-main); width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center;}
        .theme-btn:hover { background: var(--border); }

        .nav-tabs { display: flex; justify-content: center; background: var(--bg-page); padding: 6px; border-radius: 30px; margin-bottom: 30px; gap: 5px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 25px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 15px; font-weight: 500; border-radius: 25px; font-family: inherit;}
        .tab-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* ================= ตัวกรองภูมิภาค ================= */
        .filter-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: thin; scrollbar-color: #ced6e0 transparent; -webkit-overflow-scrolling: touch; }
        .filter-scroll::-webkit-scrollbar { height: 6px; }
        .filter-scroll::-webkit-scrollbar-track { background: transparent; }
        .filter-scroll::-webkit-scrollbar-thumb { background: #dfe4ea; border-radius: 10px; }
        body[data-theme="dark"] .filter-scroll::-webkit-scrollbar-thumb { background: #353b48; }

        .filter-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 95px; padding: 10px 15px; border-radius: 18px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); cursor: pointer; flex-shrink: 0; }
        .filter-btn:hover { border-color: var(--primary); }
        .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .filter-btn .kanji { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .filter-btn .romaji { font-size: 11px; opacity: 0.9; }

        /* ================= ระบบแผนที่ & ลากขยับ & ซูม ================= */
        .map-wrapper { position: relative; width: 100%; height: 500px; border-radius: var(--radius); background: var(--bg-page); border: 1px solid var(--border); overflow: hidden; margin-bottom: 25px; touch-action: none; /* ห้ามมือถือเลื่อนหน้าจอเวลาถูแผนที่ */ }
        
        .zoom-controls { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 5px; z-index: 10; }
        .zoom-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 35px; height: 35px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .zoom-btn:hover { background: var(--border); color: var(--primary); }
        .zoom-reset { font-size: 12px; width: auto; padding: 0 10px; font-family: inherit;}

        .map-box { width: 100%; height: 100%; transform-origin: center center; }

        .pref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .pref-card { background: var(--bg-page); border: 1px solid transparent; border-radius: 16px; padding: 20px 15px; text-align: center; cursor: pointer; }
        .pref-card:hover { border-color: var(--primary); transform: translateY(-3px); background: var(--bg-card); box-shadow: var(--shadow); }

        /* ================= โหมดท่องจำ ================= */
        #flashcard-area { display: none; text-align: center; padding: 10px 0; }
        .fc-container { perspective: 1000px; width: 100%; max-width: 340px; height: 440px; margin: 0 auto 25px; }
        .fc-card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; }
        .fc-card.flipped { transform: rotateY(180deg); }
        .fc-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .fc-back { transform: rotateY(180deg); padding: 25px; }
        
        .btn-ans { padding: 15px 35px; border-radius: 16px; border: none; font-size: 16px; font-weight: 500; cursor: pointer; color: white; font-family: inherit;}

        /* ================= Modal ================= */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 420px; border-radius: var(--radius); padding: 35px; text-align: center; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; border: none; background: none; color: var(--text-muted); }
        
        .kanji-stroke-box { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .kanji-stroke-img { width: 70px; height: 70px; border: 1px dashed var(--border); border-radius: 10px; padding: 5px; background: var(--bg-page); }
        .jisho-link { display: inline-block; padding: 8px 20px; background: var(--text-main); color: var(--bg-card); border-radius: 20px; text-decoration: none; font-size: 13px; margin-bottom: 20px;}
        
        .modal-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border); }
        .nav-modal-btn { background: var(--bg-page); border: none; padding: 10px 18px; border-radius: 12px; cursor: pointer; color: var(--primary); font-weight: 500; font-family: inherit; font-size: 14px; transition: 0.2s;}
        .nav-modal-btn:hover { background: var(--border); }
        .nav-modal-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ================= Responsive สำหรับมือถือ ================= */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 25px 20px; border-radius: 20px; }
            .theme-btn { top: 20px; right: 20px; width: 40px; height: 40px; font-size: 18px; }
            h1 { font-size: 24px; }
            .map-wrapper { height: 350px; }
            .pref-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .pref-card { padding: 15px 10px; }
            .fc-container { height: 380px; max-width: 100%; }
            .modal-content { padding: 25px 20px; width: 95%; max-height: 95vh; border-radius: 20px; }
            .close-btn { top: 10px; right: 15px; }
            .tab-btn { padding: 10px 18px; font-size: 14px; }
            .zoom-controls { top: 10px; right: 10px; }
            .zoom-btn { width: 30px; height: 30px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
    
    <div class="header-box">
        <h1>Japan Prefectures</h1>
        <div style="color: var(--text-muted); font-size: 15px;">เรียนรู้แผนที่และท่องจำจังหวัดญี่ปุ่น</div>
    </div>
    
    <div class="nav-tabs">
        <button class="tab-btn active" id="nav-study" onclick="switchTab('study')">🗺️ เรียนรู้</button>
        <button class="tab-btn" id="nav-flashcard" onclick="switchTab('flashcard')">🗂️ ท่องจำ</button>
        <button class="tab-btn" id="nav-game" onclick="switchTab('game')">🎮 เกมแผนที่</button>
    </div>

    <!-- ================= โหมดเรียนรู้ ================= -->
    <div id="study-area">
        <div class="filter-scroll" id="region-filters"></div>
        
        <div class="map-wrapper" id="study-map-wrapper">
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="btnZoom(0.3, 'japan-map-div')">+</button>
                <button class="zoom-btn" onclick="btnZoom(-0.3, 'japan-map-div')">-</button>
                <button class="zoom-btn zoom-reset" onclick="btnResetZoom('japan-map-div')">Reset</button>
            </div>
            <div class="map-box" id="japan-map-div"></div>
        </div>
        
        <div style="margin: 20px 0 10px 0; font-weight: 500; color: var(--text-muted);" id="grid-title">ทุกจังหวัด (47)</div>
        <div class="pref-grid" id="pref-grid"></div>
    </div>

    <!-- ================= โหมดท่องจำ ================= -->
    <div id="flashcard-area">
        <div id="fc-progress" style="color: var(--text-muted); margin-bottom: 20px;"></div>
        <div id="fc-completed" style="display:none; padding: 40px 0;">
            <h2 style="font-size: 50px; margin: 0;">🎉</h2>
            <h3>ท่องจำจบแล้ว!</h3>
            <button class="tab-btn active" style="margin-top:10px; background: var(--primary); color:white;" onclick="initFlashcards(true)">เริ่มใหม่</button>
        </div>

        <div class="fc-container" id="fc-container" onclick="toggleFlip()">
            <div class="fc-card" id="fc-card">
                <div class="fc-face fc-front">
                    <div class="jp-text" style="font-size: 65px; font-weight: bold;" id="fc-kanji"></div>
                    <div style="font-size: 20px; color: var(--text-muted);" id="fc-romaji"></div>
                    <button style="margin-top:20px; background:var(--bg-page); border:none; border-radius:50%; width:50px; height:50px; font-size:20px; cursor:pointer;" onclick="playSound(currentWord, event)">🔊</button>
                </div>
                <div class="fc-face fc-back">
                    <div style="font-size: 22px; font-weight: 500; color: var(--primary); margin-bottom: 10px;" id="fc-thai"></div>
                    <div class="jp-text" style="font-size: 20px; color: var(--text-main);" id="fc-region"></div>
                    <div class="map-box" id="fc-map" style="height: 160px; margin-top: 15px; border-radius: 12px; margin-bottom:0; border: 1px solid var(--border);"></div>
                </div>
            </div>
        </div>
        <div style="display:flex; justify-content:center; gap:15px; opacity:0; pointer-events:none;" id="fc-actions">
            <button class="btn-ans" style="background: var(--danger);" onclick="ansCard(false, event)">จำไม่ได้</button>
            <button class="btn-ans" style="background: var(--success);" onclick="ansCard(true, event)">จำได้แล้ว</button>
        </div>
    </div>

    <!-- ================= โหมดเกมแผนที่ ================= -->
    <div id="game-area" style="display: none; text-align: center;">
        <div class="filter-scroll" id="game-filters"></div>
        <div style="background: var(--bg-page); padding: 20px; border-radius: 16px; margin-bottom: 20px;">
            <div style="font-size: 24px; color: var(--primary); font-weight: 600; margin-bottom: 5px;" id="game-prompt">เลือกระดับความยากด้านบน</div>
            <div style="font-size: 14px; color: var(--text-muted);" id="game-hint"></div>
        </div>
        
        <div class="map-wrapper" id="game-map-wrapper" style="height: 450px;">
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="btnZoom(0.3, 'game-map-div')">+</button>
                <button class="zoom-btn" onclick="btnZoom(-0.3, 'game-map-div')">-</button>
                <button class="zoom-btn zoom-reset" onclick="btnResetZoom('game-map-div')">Reset</button>
            </div>
            <div class="map-box" id="game-map-div"></div>
        </div>
    </div>
</div>

<!-- ================= Popup Modal ================= -->
<div class="modal-overlay" id="pref-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeModal(event)">×</button>
        
        <h2 class="jp-text" id="modal-kanji" style="font-size: 34px; margin: 0 0 5px 0;"></h2>
        <div style="font-size: 16px; color: var(--text-muted); margin-bottom: 5px;">
            <span id="modal-romaji"></span> <span id="modal-thai" style="color:var(--primary); font-weight:500;"></span>
        </div>
        <div style="font-size: 15px; margin-bottom: 15px;">📍 <b id="modal-region"></b></div>
        
        <div style="font-size: 13px; color: var(--text-muted); margin-top:15px;">ลำดับเส้นคันจิ (KanjiVG)</div>
        <div class="kanji-stroke-box" id="modal-stroke"></div>
        <a href="#" target="_blank" class="jisho-link" id="jisho-link">📖 ดูความหมายลึกซึ้งใน Jisho.org</a>

        <div class="map-box" id="modal-map" style="height: 150px; margin-bottom:0; border-radius: 12px; border: 1px solid var(--border);"></div>

        <div class="modal-nav">
            <button class="nav-modal-btn" id="btn-prev-modal" onclick="navigateModal(-1)">◀ ก่อนหน้า</button>
            <div style="font-size: 13px; color: var(--text-muted);" id="modal-counter">1 / 47</div>
            <button class="nav-modal-btn" id="btn-next-modal" onclick="navigateModal(1)">ถัดไป ▶</button>
        </div>
    </div>
</div>

<script>
    // ================= ระบบธีม =================
    const savedTheme = localStorage.getItem('jpMasterTheme');
    if (savedTheme) {
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-btn').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
    }

    function toggleTheme() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        document.getElementById('theme-btn').innerText = newTheme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('jpMasterTheme', newTheme);
        
        if(document.getElementById('study-area').style.display !== 'none') drawMainMap(currentFilterIdx);
        if(document.getElementById('game-area').style.display !== 'none' && isGameRunning) redrawGameMap();
    }

    // ================= ระบบซูม & ลากเลื่อน (Pan & Zoom) =================
    const mapStates = {
        'japan-map-div': { scale: 1, x: 0, y: 0, panning: false, startX: 0, startY: 0 },
        'game-map-div': { scale: 1, x: 0, y: 0, panning: false, startX: 0, startY: 0 }
    };

    function enablePanZoom(wrapperId, mapId) {
        const wrapper = document.getElementById(wrapperId);
        const map = document.getElementById(mapId);
        const s = mapStates[mapId];

        wrapper.style.cursor = "grab";

        function applyTransform(smooth = false) {
            map.style.transition = smooth ? "transform 0.15s ease-out" : "none";
            map.style.transform = `translate(${s.x}px, ${s.y}px) scale(${s.scale})`;
        }

        // --- ลากขยับ (Mouse) ---
        wrapper.addEventListener('mousedown', (e) => {
            s.panning = true;
            s.startX = e.clientX - s.x;
            s.startY = e.clientY - s.y;
            wrapper.style.cursor = "grabbing";
        });
        wrapper.addEventListener('mouseleave', () => { s.panning = false; wrapper.style.cursor = "grab"; });
        wrapper.addEventListener('mouseup', () => { s.panning = false; wrapper.style.cursor = "grab"; });
        wrapper.addEventListener('mousemove', (e) => {
            if (!s.panning) return;
            s.x = e.clientX - s.startX;
            s.y = e.clientY - s.startY;
            applyTransform();
        });

        // --- ลากขยับ (Touch มือถือ) ---
        wrapper.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                s.panning = true;
                s.startX = e.touches[0].clientX - s.x;
                s.startY = e.touches[0].clientY - s.y;
            }
        });
        wrapper.addEventListener('touchend', () => { s.panning = false; });
        wrapper.addEventListener('touchmove', (e) => {
            if (!s.panning || e.touches.length !== 1) return;
            s.x = e.touches[0].clientX - s.startX;
            s.y = e.touches[0].clientY - s.startY;
            applyTransform();
        });

        // --- ซูมด้วย Scroll Mouse ---
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault(); 
            const zoomStep = 0.15;
            if (e.deltaY < 0) s.scale += zoomStep; // ซูมเข้า
            else s.scale -= zoomStep; // ซูมออก

            s.scale = Math.min(Math.max(1, s.scale), 4);
            if (s.scale === 1) { s.x = 0; s.y = 0; } // คืนค่ากลางถ้าซูมสุด
            applyTransform(true);
        }, { passive: false });
    }

    // ปุ่มควบคุมซูม
    function btnZoom(step, mapId) {
        let s = mapStates[mapId];
        s.scale += step;
        s.scale = Math.min(Math.max(1, s.scale), 4);
        if(s.scale === 1) { s.x = 0; s.y = 0; }
        document.getElementById(mapId).style.transition = "transform 0.2s ease-out";
        document.getElementById(mapId).style.transform = `translate(${s.x}px, ${s.y}px) scale(${s.scale})`;
    }

    function btnResetZoom(mapId) {
        let s = mapStates[mapId];
        s.scale = 1; s.x = 0; s.y = 0;
        document.getElementById(mapId).style.transition = "transform 0.3s ease-out";
        document.getElementById(mapId).style.transform = `translate(0px, 0px) scale(1)`;
    }

    // ================= ตัวแปรหลัก & เริ่มต้น =================
    let currentFilterIdx = -1;
    let currentDisplayList = []; 
    let currentModalIndex = 0;
    
    google.charts.load('current', { 'packages': ['geochart'] });
    google.charts.setOnLoadCallback(() => {
        renderFilters('region-filters', selectStudyFilter);
        renderFilters('game-filters', startGame);
        selectStudyFilter(-1);
        
        // เปิดระบบลาก-ซูม ทันทีที่โหลดเสร็จ
        enablePanZoom('study-map-wrapper', 'japan-map-div');
        enablePanZoom('game-map-wrapper', 'game-map-div');
    });

    function switchTab(tab) {
        document.getElementById('study-area').style.display = tab === 'study' ? 'block' : 'none';
        document.getElementById('flashcard-area').style.display = tab === 'flashcard' ? 'block' : 'none';
        document.getElementById('game-area').style.display = tab === 'game' ? 'block' : 'none';
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('nav-' + tab).classList.add('active');
        
        if(tab === 'study') drawMainMap(currentFilterIdx);
        if(tab === 'flashcard' && deck.length === 0) initFlashcards();
        if(tab === 'game' && !isGameRunning) drawEmptyGameMap();
    }

    function playSound(word, e) {
        if(e) e.stopPropagation();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'ja-JP'; utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }

    // ================= โหมดเรียนรู้ =================
    function renderFilters(containerId, callback) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        
        let btnAll = document.createElement('div');
        btnAll.className = 'filter-btn active';
        btnAll.innerHTML = `<div class="kanji">ทั่วประเทศ</div><div class="romaji">All Japan</div>`;
        btnAll.onclick = () => { setActiveFilter(container, btnAll); callback(-1); };
        container.appendChild(btnAll);

        japanData.forEach((reg, idx) => {
            let btn = document.createElement('div');
            btn.className = 'filter-btn jp-text';
            btn.innerHTML = `<div class="kanji">${reg.region.split(' ')[0]}</div><div class="romaji">${reg.romaji.split(' ')[0]}</div>`;
            btn.onclick = () => { setActiveFilter(container, btn); callback(idx); };
            container.appendChild(btn);
        });
    }

    function setActiveFilter(container, activeBtn) {
        container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
    }

    function selectStudyFilter(idx) {
        currentFilterIdx = idx;
        currentDisplayList = [];
        japanData.forEach((reg, rIdx) => {
            if (idx !== -1 && idx !== rIdx) return;
            reg.prefectures.forEach(pref => {
                currentDisplayList.push({ pref, reg });
            });
        });

        drawMainMap(idx);
        renderPrefectureList();
        document.getElementById('grid-title').innerText = idx === -1 ? 'ทุกจังหวัด (47)' : `ภูมิภาค ${japanData[idx].thai} (${japanData[idx].prefectures.length} จังหวัด)`;
        btnResetZoom('japan-map-div'); 
    }

    let mapIndexLookup = [];
    function drawMainMap(hlIdx = -1) {
        if (!google.visualization) return;
        let mapData = new google.visualization.DataTable();
        mapData.addColumn('string', 'Prefecture'); mapData.addColumn('number', 'Color'); mapData.addColumn({type: 'string', role: 'tooltip'});
        mapIndexLookup = [];
        
        japanData.forEach((reg, rIdx) => {
            reg.prefectures.forEach(pref => {
                let val = (hlIdx === -1 || hlIdx === rIdx) ? (rIdx + 1) : 0;
                mapData.addRow(['JP-' + String(pref.id).padStart(2, '0'), val, pref.kanji]);
                mapIndexLookup.push({ pref: pref, reg: reg });
            });
        });

        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const emptyColor = isDark ? '#2d3238' : '#e8ecf1';
        const colors = ['#ff7675', '#f3a683', '#55efc4', '#74b9ff', '#a29bfe', '#e17055', '#fd79a8', '#b2bec3'];

        let options = {
            region: 'JP', resolution: 'provinces',
            colorAxis: { values: [0, 1, 2, 3, 4, 5, 6, 7, 8], colors: [emptyColor, ...colors] },
            backgroundColor: 'transparent', datalessRegionColor: emptyColor, legend: 'none',
            tooltip: { textStyle: { fontName: 'Kanit', fontSize: 14 } }
        };

        let chart = new google.visualization.GeoChart(document.getElementById('japan-map-div'));
        google.visualization.events.addListener(chart, 'select', () => {
            let sel = chart.getSelection();
            if (sel.length > 0) {
                // กันบัคคลิกค้างตอนลาก
                if(mapStates['japan-map-div'].panning) return; 
                let clickedId = parseInt(mapData.getValue(sel[0].row, 0).replace('JP-', ''));
                let foundIndex = currentDisplayList.findIndex(item => item.pref.id === clickedId);
                if(foundIndex !== -1) openModal(foundIndex);
            }
        });
        chart.draw(mapData, options);
    }

    function renderPrefectureList() {
        const grid = document.getElementById('pref-grid');
        grid.innerHTML = '';
        currentDisplayList.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = 'pref-card';
            div.innerHTML = `
                <div class="jp-text" style="font-size:24px; font-weight:700; color:var(--text-main);">${item.pref.kanji}</div>
                <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">${item.pref.romaji}</div>
            `;
            div.onclick = () => openModal(index);
            grid.appendChild(div);
        });
    }

    // ================= ระบบ Modal (เลื่อนซ้ายขวา) =================
    function openModal(index) {
        currentModalIndex = index;
        let data = currentDisplayList[currentModalIndex];
        let pref = data.pref, reg = data.reg;

        document.getElementById('modal-kanji').innerText = pref.kanji;
        document.getElementById('modal-romaji').innerText = pref.romaji;
        document.getElementById('modal-thai').innerText = pref.thai ? `(${pref.thai})` : '';
        document.getElementById('modal-region').innerText = `${reg.region} ${reg.thai ? `(${reg.thai})` : ''}`;
        document.getElementById('jisho-link').href = `https://jisho.org/search/${pref.kanji}%20%23kanji`;

        const strokeBox = document.getElementById('modal-stroke');
        strokeBox.innerHTML = '';
        for (let i = 0; i < pref.kanji.length; i++) {
            let charCode = pref.kanji.charCodeAt(i);
            if (charCode >= 0x4E00 && charCode <= 0x9FAF) {
                let hexCode = charCode.toString(16).padStart(5, '0');
                let img = document.createElement('img');
                img.className = 'kanji-stroke-img';
                img.src = `https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hexCode}.svg`;
                img.onerror = () => img.style.display = 'none';
                strokeBox.appendChild(img);
            }
        }

        document.getElementById('modal-counter').innerText = `${currentModalIndex + 1} / ${currentDisplayList.length}`;
        document.getElementById('btn-prev-modal').disabled = (currentModalIndex === 0);
        document.getElementById('btn-next-modal').disabled = (currentModalIndex === currentDisplayList.length - 1);
        document.getElementById('pref-modal').style.display = 'flex';
        
        setTimeout(() => drawMiniMap('modal-map', pref.id, reg.color || '#54a0ff'), 50);
    }

    function navigateModal(step) {
        let newIndex = currentModalIndex + step;
        if (newIndex >= 0 && newIndex < currentDisplayList.length) openModal(newIndex);
    }
    
    function closeModal(e) {
        if(e.target.id === 'pref-modal' || e.target.classList.contains('close-btn')) {
            document.getElementById('pref-modal').style.display = 'none';
        }
    }

    function drawMiniMap(containerId, targetId, color) {
        if (!google.visualization) return;
        let data = new google.visualization.DataTable();
        data.addColumn('string', 'Prefecture'); data.addColumn('number', 'Color');
        japanData.forEach(reg => reg.prefectures.forEach(p => {
            data.addRow(['JP-' + String(p.id).padStart(2, '0'), p.id === targetId ? 1 : 0]);
        }));
        const empty = document.body.getAttribute('data-theme') === 'dark' ? '#2d3238' : '#e8ecf1';
        let options = { region: 'JP', resolution: 'provinces', colorAxis: { values: [0,1], colors: [empty, color] }, backgroundColor: 'transparent', datalessRegionColor: empty, legend: 'none', enableRegionInteractivity: false, tooltip: { trigger: 'none' } };
        new google.visualization.GeoChart(document.getElementById(containerId)).draw(data, options);
    }

    // ================= โหมดท่องจำ =================
    let deck = [], isFlipped = false;
    function initFlashcards(reset = false) {
        if (!reset && localStorage.getItem('jpMasterCards')) {
            deck = JSON.parse(localStorage.getItem('jpMasterCards'));
            if (deck.length > 0) { showCard(); return; }
        }
        deck = [];
        japanData.forEach(reg => reg.prefectures.forEach(pref => deck.push({ pref, reg })));
        deck.sort(() => Math.random() - 0.5);
        localStorage.setItem('jpMasterCards', JSON.stringify(deck));
        showCard();
    }
    function showCard() {
        if (deck.length === 0) {
            document.getElementById('fc-container').style.display = 'none';
            document.getElementById('fc-actions').style.opacity = '0';
            document.getElementById('fc-actions').style.pointerEvents = 'none';
            document.getElementById('fc-progress').style.display = 'none';
            document.getElementById('fc-completed').style.display = 'block';
            return;
        }
        document.getElementById('fc-container').style.display = 'block';
        document.getElementById('fc-completed').style.display = 'none';
        document.getElementById('fc-progress').style.display = 'block';
        
        let c = deck[0];
        currentWord = c.pref.kanji;
        document.getElementById('fc-kanji').innerText = c.pref.kanji;
        document.getElementById('fc-romaji').innerText = c.pref.romaji;
        document.getElementById('fc-thai').innerText = c.pref.thai || '';
        document.getElementById('fc-region').innerText = `${c.reg.region}`;
        document.getElementById('fc-progress').innerText = `เหลืออีก ${deck.length} ใบ`;

        isFlipped = false;
        document.getElementById('fc-card').classList.remove('flipped');
        document.getElementById('fc-actions').classList.remove('show');
        setTimeout(() => drawMiniMap('fc-map', c.pref.id, c.reg.color || '#54a0ff'), 50);
    }
    function toggleFlip() {
        if (deck.length === 0) return;
        isFlipped = !isFlipped;
        document.getElementById('fc-card').classList.toggle('flipped', isFlipped);
        document.getElementById('fc-actions').classList.toggle('show', isFlipped);
    }
    function ansCard(know, e) {
        e.stopPropagation();
        if (know) deck.shift(); else deck.push(deck.shift());
        localStorage.setItem('jpMasterCards', JSON.stringify(deck));
        showCard();
    }

    // ================= โหมดเกมแผนที่ =================
    let gameQueue = [], gameCurrentTarget = null, gameCorrectIds = [], gameRegionIdx = -1, isGameRunning = false, gameChart = null;
    function drawEmptyGameMap() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const emptyColor = isDark ? '#2d3238' : '#e8ecf1';
        let options = { region: 'JP', resolution: 'provinces', colorAxis: { values: [0], colors: [emptyColor] }, backgroundColor: 'transparent', datalessRegionColor: emptyColor, legend: 'none', tooltip: { trigger: 'none' } };
        let dt = new google.visualization.DataTable(); dt.addColumn('string', 'Prefecture'); dt.addColumn('number', 'Color');
        new google.visualization.GeoChart(document.getElementById('game-map-div')).draw(dt, options);
    }
    function startGame(regionIdx) {
        gameRegionIdx = regionIdx; gameQueue = []; gameCorrectIds = []; isGameRunning = true;
        if (regionIdx === -1) { japanData.forEach(r => r.prefectures.forEach(p => gameQueue.push(p))); } 
        else { japanData[regionIdx].prefectures.forEach(p => gameQueue.push(p)); }
        gameQueue.sort(() => Math.random() - 0.5);
        btnResetZoom('game-map-div'); 
        nextGameQuestion();
    }
    function nextGameQuestion() {
        if (gameQueue.length === 0) {
            document.getElementById('game-prompt').innerHTML = "🎉 สุดยอด! เติมแผนที่ครบแล้ว";
            document.getElementById('game-hint').innerHTML = "เลือกภูมิภาคด้านบนเพื่อเล่นอีกครั้ง";
            document.getElementById('game-prompt').style.color = "var(--success)";
            redrawGameMap(); isGameRunning = false; return;
        }
        gameCurrentTarget = gameQueue.pop();
        document.getElementById('game-prompt').innerHTML = `📍 จงหา: <span class="jp-text">${gameCurrentTarget.kanji}</span> (${gameCurrentTarget.romaji})`;
        document.getElementById('game-prompt').style.color = "var(--primary)";
        document.getElementById('game-hint').innerHTML = "คลิกที่ตำแหน่งของจังหวัดนี้บนแผนที่";
        document.getElementById('game-hint').style.color = "var(--text-muted)";
        playSound(gameCurrentTarget.kanji, null);
        redrawGameMap();
    }
    function redrawGameMap() {
        if (!google.visualization || !isGameRunning) return;
        let mapData = new google.visualization.DataTable();
        mapData.addColumn('string', 'Prefecture'); mapData.addColumn('number', 'Color'); mapData.addColumn({type: 'string', role: 'tooltip'});
        let mapLookup = [];
        japanData.forEach((reg, rIdx) => {
            reg.prefectures.forEach(pref => {
                let colorVal = 0;
                if (gameCorrectIds.includes(pref.id)) colorVal = 2;
                else if (gameRegionIdx === -1 || gameRegionIdx === rIdx) colorVal = 1;
                let tooltip = colorVal === 2 ? pref.kanji : "???";
                mapData.addRow(['JP-' + String(pref.id).padStart(2, '0'), colorVal, tooltip]);
                mapLookup.push(pref);
            });
        });
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const hiddenColor = isDark ? '#1a1d21' : '#f1f2f6';
        const activeColor = isDark ? '#3d454d' : '#dcdde1';
        const correctColor = '#1dd1a1';
        let options = { region: 'JP', resolution: 'provinces', colorAxis: { values: [0, 1, 2], colors: [hiddenColor, activeColor, correctColor] }, backgroundColor: 'transparent', datalessRegionColor: hiddenColor, legend: 'none', tooltip: { textStyle: { fontName: 'Kanit', fontSize: 16 } } };
        gameChart = new google.visualization.GeoChart(document.getElementById('game-map-div'));
        google.visualization.events.addListener(gameChart, 'select', () => {
            if (!isGameRunning || mapStates['game-map-div'].panning) return; // กันคลิกตอนกำลังลากเมาส์
            let sel = gameChart.getSelection();
            if (sel.length > 0) {
                let clickedPref = mapLookup[sel[0].row];
                if (clickedPref.id === gameCurrentTarget.id) {
                    gameCorrectIds.push(clickedPref.id);
                    document.getElementById('game-hint').innerHTML = "✅ ถูกต้อง!";
                    document.getElementById('game-hint').style.color = "var(--success)";
                    setTimeout(nextGameQuestion, 600);
                } else {
                    document.getElementById('game-hint').innerHTML = `❌ ผิด! นั่นคือ ${clickedPref.kanji}`;
                    document.getElementById('game-hint').style.color = "var(--danger)";
                }
            }
        });
        gameChart.draw(mapData, options);
    }
</script>
