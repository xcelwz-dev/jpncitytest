<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Prefectures Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <!-- ดึงข้อมูลจากไฟล์ data.js ที่เราแยกไว้ -->
    <script src="data.js"></script>
    
    <style>
        /* ================= UI มินิมอล & ตัวแปรสี ================= */
        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --text: #2d3436;
            --text-light: #8395a7;
            --border: #eaeeec;
            --primary: #4a69bd;
            --shadow: 0 10px 30px rgba(0,0,0,0.04);
            --radius: 20px;
        }

        body.dark-mode {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #f5f6fa;
            --text-light: #718093;
            --border: #2f3640;
            --primary: #6a89cc;
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        
        body { font-family: 'Prompt', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .jp-text { font-family: 'Noto Sans JP', sans-serif; }

        .container { width: 100%; max-width: 850px; background: var(--surface); padding: 35px; border-radius: var(--radius); box-shadow: var(--shadow); position: relative; }

        /* ปุ่มเปลี่ยนโหมด */
        .theme-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); padding: 8px; border-radius: 50%; }
        .theme-btn:hover { background: var(--border); }

        h1 { text-align: center; font-weight: 600; font-size: 24px; margin-top: 0; margin-bottom: 30px; letter-spacing: 0.5px; }

        /* เมนู Navigation */
        .nav-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .tab-btn { padding: 10px 22px; border: none; background: transparent; color: var(--text-light); cursor: pointer; font-size: 15px; font-weight: 500; border-radius: 30px; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(74, 105, 189, 0.3); }

        /* ================= แฟลชการ์ด (อัปเกรดใหม่) ================= */
        #flashcard-area { display: none; text-align: center; }
        .fc-container { perspective: 1000px; width: 100%; max-width: 320px; height: 420px; margin: 0 auto 25px; }
        
        .fc-card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; }
        .fc-card.flipped { transform: rotateY(180deg); }
        
        .fc-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.06); }
        
        /* ด้านหน้า: คันจิ + โรมาจิ + ปุ่มเสียง */
        .fc-front .kanji { font-size: 70px; color: var(--text); font-weight: bold; margin-bottom: 10px; }
        .fc-front .romaji { font-size: 24px; color: var(--text-light); margin-bottom: 25px; }
        .fc-front .sound-btn { background: #f1f2f6; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .fc-front .sound-btn:hover { background: #dfe4ea; transform: scale(1.05); }
        body.dark-mode .fc-front .sound-btn { background: #2f3640; }
        body.dark-mode .fc-front .sound-btn:hover { background: #353b48; }
        
        /* ด้านหลัง: ภูมิภาค + แผนที่ */
        .fc-back { transform: rotateY(180deg); padding: 25px; }
        .fc-back .region-title { font-size: 16px; color: var(--text-light); margin-bottom: 5px; }
        .fc-back .region-name { font-size: 26px; font-weight: 600; color: var(--primary); margin-bottom: 20px; }
        .fc-back img { max-width: 100%; height: 200px; object-fit: contain; }
        
        /* ปุ่มเฉลย */
        .fc-actions { display: flex; justify-content: center; gap: 15px; opacity: 0; pointer-events: none; transition: 0.3s; }
        .fc-actions.show { opacity: 1; pointer-events: auto; }
        .btn-ans { padding: 14px 28px; border-radius: 12px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; color: white; font-family: inherit; }
        .btn-ans.no { background: #ff7675; }
        .btn-ans.yes { background: #55efc4; color: #2d3436; }

        /* ================= แผนที่ & อื่นๆ ================= */
        #japan-map-div { width: 100%; height: 480px; border-radius: var(--radius); margin-top: 20px; background: transparent; }
        .region-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .btn-reg { display: flex; flex-direction: column; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 8px 16px; border-radius: 12px; cursor: pointer; color: var(--text); min-width: 80px; transition: 0.2s; }
        .btn-reg:hover { background: var(--border); }
        .btn-reg .kanji { font-size: 16px; font-weight: bold; }
        .btn-reg .romaji { font-size: 11px; color: var(--text-light); }

    </style>
</head>
<body>

<div class="container">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
    <h1>Japan Master</h1>
    
    <div class="nav-tabs">
        <button class="tab-btn" id="nav-flashcard" onclick="switchTab('flashcard')">🗂️ ท่องจำ</button>
        <button class="tab-btn active" id="nav-study" onclick="switchTab('study')">🗺️ แผนที่</button>
    </div>

    <!-- โหมดท่องจำ -->
    <div id="flashcard-area">
        <p style="color: var(--text-light); margin-bottom: 20px;" id="fc-count">การ์ดคงเหลือ: 47</p>
        
        <div class="fc-container" onclick="toggleFlip()">
            <div class="fc-card" id="fc-card">
                <!-- ด้านหน้า: คันจิ + โรมาจิ + เสียง -->
                <div class="fc-face fc-front">
                    <div class="jp-text kanji" id="fc-kanji">東京</div>
                    <div class="romaji" id="fc-romaji">Tokyo</div>
                    <!-- ปุ่มเสียง: ใส่ stopPropagation เพื่อไม่ให้การ์ดพลิกตอนกดลำโพง -->
                    <button class="sound-btn" onclick="playSound(event)">🔊</button>
                    <div style="position:absolute; bottom:15px; font-size:12px; color:var(--text-light);">แตะการ์ดเพื่อดูเฉลย</div>
                </div>
                <!-- ด้านหลัง: ภูมิภาค + แผนที่ -->
                <div class="fc-face fc-back">
                    <div class="region-title">ตั้งอยู่ในภูมิภาค</div>
                    <div class="jp-text region-name" id="fc-region">関東 (Kanto)</div>
                    <img src="" id="fc-img" alt="Map">
                </div>
            </div>
        </div>

        <div class="fc-actions" id="fc-actions">
            <button class="btn-ans no" onclick="ansCard(false, event)">จำไม่ได้ ❌</button>
            <button class="btn-ans yes" onclick="ansCard(true, event)">จำได้แล้ว ✅</button>
        </div>
    </div>

    <!-- โหมดแผนที่ -->
    <div id="study-area">
        <div class="region-list" id="region-buttons"></div>
        <div id="japan-map-div"></div>
    </div>
</div>

<script>
    // ================= โหมดกลางคืน =================
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.getElementById('theme-icon').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        if(document.getElementById('study-area').style.display !== 'none') drawMap(currentMapIdx);
    }

    // ================= ระบบเสียงอ่าน (Web Speech API) =================
    let currentWord = "東京";
    function playSound(e) {
        e.stopPropagation(); // สำคัญ! ป้องกันไม่ให้การ์ดพลิกเวลาจิ้มรูปลำโพง
        const utterance = new SpeechSynthesisUtterance(currentWord);
        utterance.lang = 'ja-JP'; // ตั้งค่าเป็นเสียงคนญี่ปุ่น
        utterance.rate = 0.85;    // ปรับความเร็วให้อ่านช้าลงนิดนึงเพื่อการเรียน
        window.speechSynthesis.speak(utterance);
    }

    // ================= สลับหน้าจอ =================
    function switchTab(tab) {
        document.getElementById('study-area').style.display = tab === 'study' ? 'block' : 'none';
        document.getElementById('flashcard-area').style.display = tab === 'flashcard' ? 'block' : 'none';
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('nav-' + tab).classList.add('active');
        
        if(tab === 'study') drawMap(currentMapIdx);
        if(tab === 'flashcard' && deck.length === 0) initCards();
    }

    // ================= ระบบแผนที่ =================
    let chart, mapData, currentMapIdx = -1;
    const regionDiv = document.getElementById('region-buttons');
    
    let btnAll = document.createElement('div');
    btnAll.className = 'btn-reg';
    btnAll.innerHTML = `<div class="kanji">🗺️</div><div class="romaji">Show All</div>`;
    btnAll.onclick = () => { drawMap(-1); setBtnActive(btnAll, null); };
    regionDiv.appendChild(btnAll);

    japanData.forEach((data, index) => {
        let btn = document.createElement('div');
        btn.className = 'btn-reg';
        btn.innerHTML = `<div class="kanji">${data.region}</div><div class="romaji">${data.romaji}</div>`;
        btn.onclick = () => { drawMap(index); setBtnActive(btn, regionColors[index]); };
        regionDiv.appendChild(btn);
    });

    function setBtnActive(btn, color) {
        document.querySelectorAll('.btn-reg').forEach(b => { b.style.background = ''; b.style.borderColor = ''; b.style.color = ''; });
        if(color) { btn.style.background = color; btn.style.color = '#000'; btn.style.borderColor = color; }
    }
    setBtnActive(btnAll, null);

    google.charts.load('current', { 'packages': ['geochart'] });
    google.charts.setOnLoadCallback(() => drawMap(-1));

    function drawMap(hlIdx) {
        if (!google.visualization) return;
        currentMapIdx = hlIdx;
        mapData = new google.visualization.DataTable();
        mapData.addColumn('string', 'Prefecture'); mapData.addColumn('number', 'Color'); mapData.addColumn({type: 'string', role: 'tooltip'});
        
        japanData.forEach((reg, rIdx) => {
            reg.prefectures.forEach(pref => {
                mapData.addRow(['JP-' + String(pref.id).padStart(2, '0'), (hlIdx === -1 || hlIdx === rIdx) ? (rIdx + 1) : 0, pref.kanji]);
            });
        });

        const isDark = document.body.classList.contains('dark-mode');
        var options = {
            region: 'JP', resolution: 'provinces',
            colorAxis: { values: [0, 1, 2, 3, 4, 5, 6, 7, 8], colors: [isDark ? '#2f3640' : '#eaeeec', ...regionColors] },
            backgroundColor: 'transparent', datalessRegionColor: isDark ? '#2f3640' : '#eaeeec', legend: 'none'
        };
        chart = new google.visualization.GeoChart(document.getElementById('japan-map-div'));
        chart.draw(mapData, options);
    }

    // ================= ระบบแฟลชการ์ด =================
    let deck = [], currentCard = 0, isFlipped = false;

    function initCards() {
        deck = [];
        japanData.forEach(reg => reg.prefectures.forEach(pref => deck.push({ pref, reg })));
        deck.sort(() => Math.random() - 0.5); // สับไพ่
        currentCard = 0;
        showCard();
    }

    function showCard() {
        if (deck.length === 0) {
            document.getElementById('fc-kanji').innerText = "🎉";
            document.getElementById('fc-romaji').innerText = "เก่งมาก! ท่องครบแล้ว";
            document.querySelector('.sound-btn').style.display = 'none';
            return;
        }
        
        let c = deck[currentCard];
        currentWord = c.pref.kanji; // อัปเดตคำอ่านสำหรับระบบเสียง
        
        // ด้านหน้า
        document.getElementById('fc-kanji').innerText = c.pref.kanji;
        document.getElementById('fc-romaji').innerText = c.pref.romaji;
        document.querySelector('.sound-btn').style.display = 'flex';
        
        // ด้านหลัง
        document.getElementById('fc-region').innerText = `${c.reg.region} (${c.reg.romaji})`;
        document.getElementById('fc-img').src = c.reg.img; // รูปรอบนี้เป็น SVG โหลดติดแน่นอน
        
        document.getElementById('fc-count').innerText = `การ์ดคงเหลือ: ${deck.length} ใบ`;
        
        isFlipped = false;
        document.getElementById('fc-card').classList.remove('flipped');
        document.getElementById('fc-actions').classList.remove('show');
    }

    function toggleFlip() {
        if(deck.length === 0) { initCards(); return; }
        isFlipped = !isFlipped;
        document.getElementById('fc-card').classList.toggle('flipped', isFlipped);
        document.getElementById('fc-actions').classList.toggle('show', isFlipped);
    }

    function ansCard(know, e) {
        e.stopPropagation();
        if (know) {
            deck.splice(currentCard, 1); // จำได้ ตัดออก
        } else {
            deck.push(deck.splice(currentCard, 1)[0]); // จำไม่ได้ ย้ายไปต่อท้ายกอง
        }
        showCard();
    }
</script>

</body>
</html>
